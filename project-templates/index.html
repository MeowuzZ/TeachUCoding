<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活服务项目</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><small>LOCAL PROJECT / 本地项目</small><h1 id="project-title">生活服务台</h1><p id="project-description"></p></header><main>
<section aria-label="概览" id="summary"></section><section><h2>新增业务记录</h2><form id="record-form"><label>名称<input name="title" required maxlength="80"></label><label>分类<select name="category" id="category"></select></label><label id="amount-label">数量／金额<input name="amount" type="number" min="0" max="100000000" step="1" required></label><label>说明<textarea name="note" maxlength="500"></textarea></label><button>保存记录</button></form><p id="message" role="status"></p></section>
<section><h2>业务清单</h2><div class="toolbar"><label>搜索<input id="search" type="search" placeholder="搜索名称、分类或说明"></label><label>状态<select id="status-filter"><option value="">全部状态</option></select></label><button id="export" type="button">导出 CSV</button></div><div id="records"></div></section></main><footer>本地教学原型 · 使用模拟数据 · 无登录与真实支付</footer></body></html>
